<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewhäus Coffee - Coming Soon</title>
    <style>
        /* Tetapan Asas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #b30000; /* Warna merah premium menyerupai poster */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Container Utama */
        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem; /* Jarak antara setiap elemen */
        }

        /* Teks Coming Soon */
        .coming-soon {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* Struktur Logo */
        .logo-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* Tetapan Imej Logo */
        .logo-img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Kawalan saiz spesifik untuk setiap logo agar seimbang */
        .logo-brewhaus {
            width: 65%;
        }

        .logo-coffee {
            width: 70%;
        }

        .logo-multilang {
            width: 85%;
        }

        /* Teks Hak Cipta di Bawah */
        .footer-text {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="coming-soon">Coming Soon</div>

        <div class="logo-box">
            <img src="images/Artwork 2.png" alt="Brewhäus" class="logo-img logo-brewhaus">
            <img src="images/Logo 2.png" alt="Brewhäus Coffee" class="logo-img logo-coffee">
            <img src="images/All White.png" alt="Brewhäus" class="logo-img logo-brewhaus">
        </div>

        <div class="footer-text">Brewhaus Group.2026</div>

    </div>

</body>
</html>
